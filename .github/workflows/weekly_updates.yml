name: Weekly Database Updates and Keep-Alive

on:
  schedule:
    # Run every Monday at 10 AM UTC
    - cron: '0 10 * * 1'
  workflow_dispatch: # Allows manual triggering for testing
    inputs:
      since_date:
        description: "Pinecone backfill: re-crawl topics newer than this date (YYYY-MM-DD). Leave blank for a normal run."
        required: false
        default: ""
      qdrant_since_date:
        description: "Qdrant backfill: re-crawl groups.io topics newer than this date (YYYY-MM-DD). Leave blank for a normal run."
        required: false
        default: ""

permissions:
  contents: read
  issues: write   # needed by the "Open issue on failure" step

env:
  PYTHON_VERSION: '3.12'

jobs:
  weekly-updates:
    runs-on: ubuntu-24.04   # 26.04 apt mirrors were stalling; switch back later if you like
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        timeout-minutes: 15
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright browsers
        timeout-minutes: 15
        # Only the two browsers the scripts use (Firefox: surfacehippy crawl, Chromium: crawl4ai
        # and groups.io). Skipping WebKit saves a download and its system libraries.
        run: |
          playwright install --with-deps chromium firefox

      - name: Run Qdrant keep-alive query
        id: keepalive
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
        run: |
          set -o pipefail
          echo "Running Qdrant keep-alive query..."
          python -u qdrant_keep_alive.py 2>&1 | tee keepalive.log
          echo "keepalive_status=success" >> $GITHUB_OUTPUT

      - name: Restore Qdrant state cache
        id: cache-qdrant
        uses: actions/cache/restore@v5
        with:
          path: qdrant_latest_date.json
          key: qdrant-state-${{ github.run_number }}
          restore-keys: |
            qdrant-state-

      - name: Check cached Qdrant state
        run: |
          if [ -f qdrant_latest_date.json ]; then
            echo "✓ Qdrant state cache found"
            echo "Cached content:"
            cat qdrant_latest_date.json
          else
            echo "✗ No Qdrant state cache found - will perform full scan"
          fi

      - name: Run Qdrant incremental update
        timeout-minutes: 25
        id: qdrant
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_HOST: ${{ secrets.LANGFUSE_HOST }}
          GROUPSIO_COOKIE: ${{ secrets.GROUPSIO_COOKIE }}
          SINCE_DATE_OVERRIDE: ${{ github.event.inputs.qdrant_since_date }}
        run: |
          set -o pipefail
          echo "Starting Qdrant incremental update..."
          python -u incremental_update_qdrant.py 2>&1 | tee qdrant_update.log
          echo "qdrant_status=success" >> $GITHUB_OUTPUT

      - name: Save Qdrant state cache
        uses: actions/cache/save@v5
        if: steps.qdrant.outputs.qdrant_status == 'success'
        with:
          path: qdrant_latest_date.json
          key: qdrant-state-${{ github.run_number }}

      - name: Verify saved Qdrant state
        if: steps.qdrant.outputs.qdrant_status == 'success'
        run: |
          if [ -f qdrant_latest_date.json ]; then
            echo "✓ Qdrant state file saved successfully"
            echo "New cached content:"
            cat qdrant_latest_date.json
          else
            echo "⚠ Warning: Qdrant state file was not created"
          fi

      - name: Restore Pinecone state cache
        id: cache-pinecone
        if: always()
        uses: actions/cache/restore@v5
        with:
          path: pinecone_latest_date.json
          key: pinecone-state-${{ github.run_number }}
          restore-keys: |
            pinecone-state-

      - name: Check cached Pinecone state
        if: always()
        run: |
          if [ -f pinecone_latest_date.json ]; then
            echo "✓ Pinecone state cache found"
            echo "Cached content:"
            cat pinecone_latest_date.json
          else
            echo "✗ No Pinecone state cache found - will perform full scan"
          fi

      - name: Run Pinecone incremental update
        timeout-minutes: 25
        id: pinecone
        if: always()
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_HOST: ${{ secrets.LANGFUSE_HOST }}
          GROUPSIO_COOKIE: ${{ secrets.GROUPSIO_COOKIE }}
          SINCE_DATE_OVERRIDE: ${{ github.event.inputs.since_date }}
        run: |
          set -o pipefail
          echo "Starting Pinecone incremental update..."
          python -u incremental_pinecone_ingestion.py --debug 2>&1 | tee pinecone_update.log
          echo "pinecone_status=success" >> $GITHUB_OUTPUT

      - name: Upload debug HTML
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: debug-html
          path: |
            debug_forum_index.html
            debug_board.html
            pinecone_update.log
            groupsio_failure.png
            groupsio_failure.html

      - name: Save Pinecone state cache
        uses: actions/cache/save@v5
        if: always() && steps.pinecone.outputs.pinecone_status == 'success'
        with:
          path: pinecone_latest_date.json
          key: pinecone-state-${{ github.run_number }}

      - name: Verify saved Pinecone state
        if: always() && steps.pinecone.outputs.pinecone_status == 'success'
        run: |
          if [ -f pinecone_latest_date.json ]; then
            echo "✓ Pinecone state file saved successfully"
            echo "New cached content:"
            cat pinecone_latest_date.json
          else
            echo "⚠ Warning: Pinecone state file was not created"
          fi

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: update-logs-${{ github.run_number }}
          path: |
            *.log
          retention-days: 30

      - name: Create summary
        if: always()
        run: |
          echo "## Weekly Update Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Date:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Results:" >> $GITHUB_STEP_SUMMARY
          echo "- Qdrant Keep-Alive: ${{ steps.keepalive.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- Qdrant Update: ${{ steps.qdrant.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- Pinecone Update: ${{ steps.pinecone.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check the uploaded artifacts for detailed logs." >> $GITHUB_STEP_SUMMARY

      - name: Check for failures
        if: steps.pinecone.outcome != 'success' || steps.qdrant.outcome != 'success' || steps.keepalive.outcome != 'success'
        run: |
          echo "One or more steps failed"
          exit 1

      - name: Open issue on failure or timeout
        if: failure() || cancelled()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Weekly update failed or timed out — run #${context.runNumber}`,
              body: `Status: ${{ job.status }}\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            })
