name: Qdrant keep-alive

# Free Qdrant Cloud clusters are suspended after a week without use. The weekly update job is too
# close to that limit (one failed or delayed run can exceed it), so this tiny job pings the cluster
# every 3 days. It installs only qdrant-client, so it finishes in about a minute.
on:
  schedule:
    - cron: '17 15 */3 * *'    # every 3 days, 15:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install qdrant-client
        run: python -m pip install qdrant-client

      - name: Ping Qdrant
        env:
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
        run: |
          python - <<'PY'
          import os
          from qdrant_client import QdrantClient

          client = QdrantClient(url=os.environ["QDRANT_URL"], api_key=os.environ["QDRANT_API_KEY"],
                                check_compatibility=False)
          names = [c.name for c in client.get_collections().collections]
          print("collections:", names)
          for name in names:
              print(name, "points:", client.count(name, exact=False).count)
          PY
